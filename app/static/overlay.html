<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Margin assistant</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{height:100%;overflow:hidden;background:var(--sheet)}
  .pop{height:100%;display:flex;flex-direction:column;border-left:3px solid var(--red);padding:12px 16px}
  .top{display:flex;align-items:center;gap:9px}
  .top .hand{flex:1;font-size:1.15rem}
  #q{color:var(--pencil);font-size:.92rem;margin:6px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #a{flex:1;overflow-y:auto;font-size:.98rem;line-height:1.4}
</style>
</head>
<body>
<div class="pop">
  <div class="top">
    <span class="dot" id="dot" data-state="idle"></span>
    <span class="hand" id="state">listening…</span>
    <button class="ghost small" id="mute" type="button">Stop listening</button>
  </div>
  <div id="q"></div>
  <div id="a" class="prose"></div>
</div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script type="module">
import { api, connect, md } from "./common.js";
const $ = (s) => document.querySelector(s);
const LABEL = { listening: "listening…", thinking: "thinking…", speaking: "answering…", idle: "done", muted: "microphone muted" };
let text = "", current = null;
connect((ev) => {
  if (ev.type === "voice.state") {
    $("#dot").dataset.state = ev.state;
    $("#state").textContent = ev.state === "listening" && ev.detail ? "anything else?" : LABEL[ev.state] ?? ev.state;
    if (ev.state === "listening" && !ev.detail) { $("#q").textContent = ""; $("#a").textContent = ""; text = ""; }
  } else if (ev.type === "chat.user" && ev.via === "voice") {
    $("#q").textContent = ev.content; $("#a").textContent = ""; text = "";
  } else if (ev.type === "chat.start" && ev.via === "voice") {
    current = ev.id;
  } else if (ev.type === "chat.delta" && ev.id === current) {
    text += ev.text; $("#a").innerHTML = md(text); $("#a").scrollTop = $("#a").scrollHeight;
  } else if (ev.type === "chat.done" && ev.id === current) {
    $("#a").innerHTML = md(ev.content);
  }
});
$("#mute").onclick = () => api("/api/voice/mute", { method: "POST", json: { muted: true } });
</script>
</body>
</html>
